<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>詩句牆</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0E1A;
    --paper:#F4EDE0;
    --magenta:#FF6FA5;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; height:100%; overflow:hidden;
    background:var(--ink);
    color:var(--paper);
    font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  }
  .stage{
    position:relative;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .idle{
    color:rgba(244,237,224,0.25);
    font-size:22px;
    letter-spacing:4px;
  }

  /* 海報：顏色滿版鋪滿整個畫面，直角，無光暈，直接出現不做浮動動畫 */
  .ticket{
    width:100vw;
    height:100vh;
    background:var(--tpl-bg, #123E8C);
    color:var(--tpl-fg, #E8323A);
    border-radius:0;
    padding:64px 84px;
    position:relative;
    overflow:hidden;
    opacity:0;
    font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;
    font-weight:500;
  }
  .ticket.show{
    opacity:1;
  }

  .author-tag{
    position:absolute;
    right:26px; bottom:20px;
    font-size:24px;
    font-weight:500;
    letter-spacing:1px;
    display:inline-block;
    transform:scaleX(0.6);
    transform-origin:right;
  }

  /* 短句：單行大字，字寬拉長60%，並用JS動態撐滿版面寬度 */
  .tpl-single{
    height:100%;
    display:flex;
    align-items:center;
  }
  .tpl-single .line{
    display:inline-block;
    white-space:nowrap;
    line-height:1.15;
    font-weight:500;
    transform:scaleX(0.6);
    transform-origin:left;
  }

  /* 中等長度：置中多行，每行底線，字寬拉長至60%（窄長），整體字級加大120% */
  .tpl-underlined{
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:18px;
  }
  .tpl-underlined .line{
    display:inline-block;
    font-size:clamp(44px, 6.2vw, 82px);
    font-weight:500;
    border-bottom:2px solid currentColor;
    padding-bottom:3px;
    transform:scaleX(0.6);
  }

  /* 長句：左對齊多行，緊湊堆疊，字寬壓扁至120%（扁寬），整體字級加大120% */
  .tpl-plain{
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:flex-start;
    gap:6px;
  }
  .tpl-plain .line{
    display:inline-block;
    font-size:clamp(32px, 4.1vw, 56px);
    font-weight:500;
    line-height:1.3;
    transform:scaleX(1.2);
    transform-origin:left;
  }

  /* 管理員面板：預設隱藏，按 H 開關 */
  .admin{
    position:fixed;
    top:16px; right:16px;
    width:340px;
    max-height:80vh;
    overflow-y:auto;
    background:rgba(11,14,26,0.95);
    border:1px solid var(--magenta);
    border-radius:12px;
    padding:14px;
    display:none;
    font-size:13px;
    z-index:999;
  }
  .admin.open{display:block;}
  .admin h3{margin:0 0 10px;color:var(--magenta);font-size:14px;}
  .admin-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 0;
    border-bottom:1px solid rgba(244,237,224,0.1);
  }
  .admin-row .txt{flex:1;color:rgba(244,237,224,0.8);}
  .admin-row .txt small{display:block;color:var(--magenta);}
  .admin-row button{
    background:transparent;
    border:1px solid var(--magenta);
    color:var(--magenta);
    border-radius:6px;
    padding:4px 8px;
    font-size:12px;
    cursor:pointer;
  }
  .admin-row.hidden .txt{opacity:0.4;text-decoration:line-through;}
  .admin-row.hidden button{border-color:#5EEAD4;color:#5EEAD4;}
  .hint{
    position:fixed; bottom:8px; right:12px;
    font-size:11px; color:rgba(244,237,224,0.3);
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="idle" id="idle">✦ 等待第一句 ✦</div>
    <div class="ticket" id="ticket">
      <div class="poster-inner" id="posterInner"></div>
    </div>
  </div>

  <div class="admin" id="admin">
    <h3>管理面板（按 H 關閉）</h3>
    <div id="adminList"></div>
  </div>
  <div class="hint">按 H 開啟管理面板</div>

<script>
  // TODO: 部署 Apps Script 後，把網址貼在這裡
  var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbywrbT-ehHvpV60g1RmNGb6DaXWZDCTkuY8ZL0jdZz_2Piz4eJUzQSHOmOLTDyTZ6K_/exec";
  var POLL_MS = 4000;
  var MIN_DISPLAY_MS = 4500; // 每則詩句最少停留時間

  var seenIds = new Set();
  var queue = [];
  var showing = false;
  var idleEl = document.getElementById('idle');
  var ticketEl = document.getElementById('ticket');
  var posterInnerEl = document.getElementById('posterInner');

  // 顏色隨機挑一組，排版則依文字長度決定（見 pickLayout_）
  var COLOR_PALETTE = [
    { bg:'#123E8C', fg:'#E8323A' }, // 藍底紅字
    { bg:'#7A1010', fg:'#E8323A' }, // 深紅底紅字
    { bg:'#0A0A0A', fg:'#C13FD6' }  // 黑底紫字
  ];

  function escapeHtml_(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // 依中文標點把詩句拆成好幾行
  function splitPoemLines_(text){
    var parts = text.match(/[^，。！？；、\n]+[，。！？；、]?/g);
    return (parts && parts.length) ? parts.map(function(s){ return s.trim(); }).filter(Boolean) : [text];
  }

  // 單行大字：動態算字級，讓文字在套用 scaleX 窄化後仍能撐滿版面寬度
  // 原理：先用一個基準字級量測文字自然寬度，反推需要多大字級，
  // 讓「自然寬度 × scaleX」剛好等於版面可用寬度
  function fitLineToWidth_(lineEl, targetWidth, scaleX){
    var probeSize = 100;
    lineEl.style.transform = 'none';
    lineEl.style.fontSize = probeSize + 'px';
    var measured = lineEl.offsetWidth;
    if (measured <= 0) return;
    var neededSize = probeSize * (targetWidth / scaleX) / measured;
    neededSize = Math.max(20, Math.min(neededSize, 260)); // 安全上下限，避免字數極端時跑出誇張數字
    lineEl.style.fontSize = neededSize + 'px';
    lineEl.style.transform = 'scaleX(' + scaleX + ')';
  }

  // 依拆出來的行數決定用哪種排版：
  // 1 行 → 單行大字／2~3 行 → 置中底線／4 行以上 → 左對齊緊湊堆疊
  function pickLayout_(lines){
    if (lines.length <= 1) return 'single';
    if (lines.length <= 3) return 'underlined';
    return 'plain';
  }

  function renderPoster(item){
    var color = COLOR_PALETTE[Math.floor(Math.random() * COLOR_PALETTE.length)];
    ticketEl.style.setProperty('--tpl-bg', color.bg);
    ticketEl.style.setProperty('--tpl-fg', color.fg);

    var lines = splitPoemLines_(item.poem);
    var layout = pickLayout_(lines);
    var wrapClass = layout === 'single' ? 'tpl-single'
                  : layout === 'underlined' ? 'tpl-underlined'
                  : 'tpl-plain';

    var linesHtml = lines.map(function(l){
      return '<div class="line">' + escapeHtml_(l) + '</div>';
    }).join('');

    posterInnerEl.innerHTML =
      '<div class="' + wrapClass + '">' + linesHtml + '</div>' +
      '<div class="author-tag">' + escapeHtml_(item.author) + '</div>';

    if (layout === 'single') {
      var lineEl = posterInnerEl.querySelector('.tpl-single .line');
      var availableWidth = posterInnerEl.clientWidth;
      if (lineEl && availableWidth > 0) {
        fitLineToWidth_(lineEl, availableWidth, 0.6);
      }
    }
  }

  function showNext(){
    if (showing || queue.length === 0) return;
    showing = true;
    idleEl.style.display = 'none';

    var item = queue.shift();
    renderPoster(item);
    ticketEl.classList.add('show'); // 第一次顯示才需要，之後保持可見不再拿掉

    setTimeout(function(){
      showing = false;
      showNext();
    }, MIN_DISPLAY_MS);
  }

  function poll(){
    if (APPS_SCRIPT_URL.indexOf('PASTE_') === 0) return;
    fetch(APPS_SCRIPT_URL + '?t=' + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(list){
        list.sort(function(a,b){ return a.time - b.time; });
        list.forEach(function(item){
          if (!seenIds.has(item.id)) {
            seenIds.add(item.id);
            queue.push(item);
          }
        });
        showNext();
        renderAdminIfOpen();
      })
      .catch(function(err){ console.error('poll error', err); });
  }

  // ---- 管理面板 ----
  var adminOpen = false;
  var adminEl = document.getElementById('admin');
  var adminListEl = document.getElementById('adminList');

  document.addEventListener('keydown', function(e){
    if (e.key.toLowerCase() === 'h') {
      adminOpen = !adminOpen;
      adminEl.classList.toggle('open', adminOpen);
      if (adminOpen) renderAdminIfOpen();
    }
  });

  function renderAdminIfOpen(){
    if (!adminOpen || APPS_SCRIPT_URL.indexOf('PASTE_') === 0) return;
    fetch(APPS_SCRIPT_URL + '?all=1&t=' + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(list){
        list.sort(function(a,b){ return b.time - a.time; });
        list = list.slice(0, 15);
        adminListEl.innerHTML = '';
        list.forEach(function(item){
          var row = document.createElement('div');
          row.className = 'admin-row' + (item.status === 'hidden' ? ' hidden' : '');
          var txt = document.createElement('div');
          txt.className = 'txt';
          txt.innerHTML = item.poem.slice(0, 24) + (item.poem.length > 24 ? '…' : '') +
            '<small>' + item.author + '</small>';
          var btn = document.createElement('button');
          var isHidden = item.status === 'hidden';
          btn.textContent = isHidden ? '恢復' : '下架';
          btn.onclick = function(){
            var action = isHidden ? 'unhide' : 'hide';
            fetch(APPS_SCRIPT_URL + '?action=' + action + '&id=' + encodeURIComponent(item.id))
              .then(function(){ renderAdminIfOpen(); });
          };
          row.appendChild(txt);
          row.appendChild(btn);
          adminListEl.appendChild(row);
        });
      });
  }

  poll();
  setInterval(poll, POLL_MS);
</script>
</body>
</html>
