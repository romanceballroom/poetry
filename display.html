<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>詩句牆</title>
<style>
  :root{
    --ink:#0B0E1A;
    --paper:#F4EDE0;
    --amber:#FFB84D;
    --cyan:#5EEAD4;
    --magenta:#FF6FA5;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; height:100%; overflow:hidden;
    background:
      radial-gradient(circle at 15% 20%, rgba(255,184,77,0.10), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(94,234,212,0.10), transparent 45%),
      var(--ink);
    color:var(--paper);
    font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  }
  .stage{
    position:relative;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .idle{
    color:rgba(244,237,224,0.25);
    font-size:22px;
    letter-spacing:4px;
  }
  .ticket{
    width:min(70vw, 900px);
    background:var(--tpl-bg, rgba(244,237,224,0.04));
    color:var(--tpl-fg, var(--paper));
    border:1px solid var(--tpl-accent, rgba(255,184,77,0.5));
    border-radius:14px;
    padding:56px 64px;
    text-align:left;
    opacity:0;
    transform:translateY(24px) scale(0.96);
    transition:opacity 0.7s ease, transform 0.7s cubic-bezier(.2,.9,.3,1.2), background 0.3s, color 0.3s, border-color 0.3s;
    box-shadow:0 0 0 rgba(255,184,77,0);
    position:relative;
    overflow:visible;
  }
  .ticket.show{
    opacity:1;
    transform:translateY(0) scale(1);
    box-shadow:0 0 60px var(--tpl-accent, rgba(255,184,77,0.12));
  }
  .ticket.speaking{
    box-shadow:0 0 80px var(--tpl-accent, rgba(94,234,212,0.18));
  }

  .poster-inner{ position:relative; }
  .poster-eyebrow{
    font-size:13px;
    letter-spacing:3px;
    font-weight:700;
    margin-bottom:20px;
    color:var(--tpl-accent, var(--amber));
  }
  .poster-lines{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .poster-line{
    font-size:clamp(24px, 3.4vw, 46px);
    line-height:1.35;
  }
  .poster-line.rule{
    border-bottom:2px solid var(--tpl-accent, transparent);
    padding-bottom:8px;
    margin-bottom:6px;
    display:inline-block;
  }
  .poster-badge{
    position:absolute;
    top:-20px; left:-20px;
    width:46px; height:46px;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    font-size:16px;
    background:var(--tpl-accent, var(--amber));
    color:var(--tpl-bg, var(--ink));
  }
  .poster-barcode{
    margin-top:22px;
    opacity:0.85;
  }

  .archive{
    position:absolute;
    bottom:24px;
    left:0; right:0;
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    padding:0 40px;
    max-height:120px;
    overflow:hidden;
    opacity:0.5;
  }
  .chip{
    font-size:12px;
    color:rgba(244,237,224,0.6);
    border:1px solid rgba(244,237,224,0.15);
    border-radius:999px;
    padding:5px 12px;
    white-space:nowrap;
    max-width:220px;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  /* 管理員面板：預設隱藏，按 H 開關 */
  .admin{
    position:fixed;
    top:16px; right:16px;
    width:340px;
    max-height:80vh;
    overflow-y:auto;
    background:rgba(11,14,26,0.95);
    border:1px solid var(--magenta);
    border-radius:12px;
    padding:14px;
    display:none;
    font-size:13px;
    z-index:999;
  }
  .admin.open{display:block;}
  .admin h3{margin:0 0 10px;color:var(--magenta);font-size:14px;}
  .admin-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 0;
    border-bottom:1px solid rgba(244,237,224,0.1);
  }
  .admin-row .txt{flex:1;color:rgba(244,237,224,0.8);}
  .admin-row .txt small{display:block;color:var(--amber);}
  .admin-row button{
    background:transparent;
    border:1px solid var(--magenta);
    color:var(--magenta);
    border-radius:6px;
    padding:4px 8px;
    font-size:12px;
    cursor:pointer;
  }
  .admin-row.hidden .txt{opacity:0.4;text-decoration:line-through;}
  .admin-row.hidden button{border-color:var(--cyan);color:var(--cyan);}
  .hint{
    position:fixed; bottom:8px; right:12px;
    font-size:11px; color:rgba(244,237,224,0.15);
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="idle" id="idle">✦ 等待第一句 ✦</div>
    <div class="ticket" id="ticket">
      <div class="poster-inner" id="posterInner"></div>
    </div>
  </div>
  <div class="archive" id="archive"></div>

  <div class="admin" id="admin">
    <h3>管理面板（按 H 關閉）</h3>
    <div id="adminList"></div>
  </div>
  <div class="hint">按 H 開啟管理面板</div>

<script>
  // TODO: 部署 Apps Script 後，把網址貼在這裡
  var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbywrbT-ehHvpV60g1RmNGb6DaXWZDCTkuY8ZL0jdZz_2Piz4eJUzQSHOmOLTDyTZ6K_/exec";
  var POLL_MS = 4000;
  var MIN_DISPLAY_MS = 4500; // 每則詩句最少停留時間（不含朗讀）

  var seenIds = new Set();
  var queue = [];
  var showing = false;
  var archiveEl = document.getElementById('archive');
  var idleEl = document.getElementById('idle');
  var ticketEl = document.getElementById('ticket');
  var posterInnerEl = document.getElementById('posterInner');

  // ---- 隨機海報排版 ----
  // 每則詩句上牆時，隨機挑一種配色+裝飾組合，讓畫面不會每次都長一樣
  var POSTER_TEMPLATES = [
    { bg:'#F4EDE0', fg:'#1E2A6E', accent:'#1E2A6E', decor:'rules' },   // 米白配靛藍，行間分隔線
    { bg:'#6FBE8C', fg:'#0B0E1A', accent:'#0B0E1A', decor:'barcode' }, // 草綠配黑，條碼感
    { bg:'#F4EDE0', fg:'#0B0E1A', accent:'#FFB84D', decor:'badge' },   // 米白配黑，編號徽章
    { bg:'#0B0E1A', fg:'#F4EDE0', accent:'#5EEAD4', decor:'rules' },   // 品牌深藍底，青色分隔線
    { bg:'#FF6FA5', fg:'#0B0E1A', accent:'#0B0E1A', decor:'badge' }    // 桃紅配黑，強對比
  ];
  var poemCounter = 0;

  function escapeHtml_(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // 依中文標點把詩句拆成好幾行，模擬海報式的分行排版
  function splitPoemLines_(text){
    var parts = text.match(/[^，。！？；、\n]+[，。！？；、]?/g);
    return (parts && parts.length) ? parts.map(function(s){ return s.trim(); }).filter(Boolean) : [text];
  }

  function buildBarcodeSvg_(color){
    var bars = '';
    var x = 0;
    for (var i = 0; i < 26; i++){
      var w = 1 + Math.random() * 3;
      if (Math.random() < 0.55) {
        bars += '<rect x="' + x + '" y="0" width="' + w + '" height="26" fill="' + color + '"/>';
      }
      x += w + 1.5;
    }
    return '<svg viewBox="0 0 ' + x + ' 26" style="height:20px;width:auto;">' + bars + '</svg>';
  }

  function renderPoster(item){
    var tpl = POSTER_TEMPLATES[Math.floor(Math.random() * POSTER_TEMPLATES.length)];
    poemCounter++;

    ticketEl.style.setProperty('--tpl-bg', tpl.bg);
    ticketEl.style.setProperty('--tpl-fg', tpl.fg);
    ticketEl.style.setProperty('--tpl-accent', tpl.accent);

    var lines = splitPoemLines_(item.poem);
    var linesHtml = lines.map(function(line, i){
      var isLast = (i === lines.length - 1);
      var bold = Math.random() < 0.45;
      var ruleClass = (tpl.decor === 'rules' && !isLast) ? ' rule' : '';
      return '<div class="poster-line' + ruleClass + '" style="font-weight:' + (bold ? 800 : 400) + ';">' +
        escapeHtml_(line) + '</div>';
    }).join('');

    var badgeHtml = tpl.decor === 'badge'
      ? '<div class="poster-badge">' + String(poemCounter).padStart(2, '0') + '</div>'
      : '';

    var barcodeHtml = tpl.decor === 'barcode'
      ? '<div class="poster-barcode">' + buildBarcodeSvg_(tpl.fg) + '</div>'
      : '';

    posterInnerEl.innerHTML =
      badgeHtml +
      '<div class="poster-eyebrow">' + escapeHtml_(item.author) + '</div>' +
      '<div class="poster-lines">' + linesHtml + '</div>' +
      barcodeHtml;
  }

  function addToArchive(poem, author){
    var chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = poem.slice(0, 14) + (poem.length > 14 ? '…' : '') + '　' + author;
    archiveEl.appendChild(chip);
    while (archiveEl.children.length > 10) {
      archiveEl.removeChild(archiveEl.firstChild);
    }
  }

  function showNext(){
    if (showing || queue.length === 0) return;
    showing = true;
    idleEl.style.display = 'none';

    var item = queue.shift();
    renderPoster(item);

    ticketEl.classList.remove('show');
    // 強制 reflow 讓動畫重新觸發
    void ticketEl.offsetWidth;
    ticketEl.classList.add('show');

    setTimeout(function(){
      ticketEl.classList.remove('show');
      addToArchive(item.poem, item.author);
      setTimeout(function(){
        showing = false;
        showNext();
      }, 700);
    }, MIN_DISPLAY_MS);
  }

  function poll(){
    if (APPS_SCRIPT_URL.indexOf('PASTE_') === 0) return;
    fetch(APPS_SCRIPT_URL + '?t=' + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(list){
        list.sort(function(a,b){ return a.time - b.time; });
        list.forEach(function(item){
          if (!seenIds.has(item.id)) {
            seenIds.add(item.id);
            queue.push(item);
          }
        });
        showNext();
        renderAdminIfOpen();
      })
      .catch(function(err){ console.error('poll error', err); });
  }

  // ---- 管理面板 ----
  var adminOpen = false;
  var adminEl = document.getElementById('admin');
  var adminListEl = document.getElementById('adminList');

  document.addEventListener('keydown', function(e){
    if (e.key.toLowerCase() === 'h') {
      adminOpen = !adminOpen;
      adminEl.classList.toggle('open', adminOpen);
      if (adminOpen) renderAdminIfOpen();
    }
  });

  function renderAdminIfOpen(){
    if (!adminOpen || APPS_SCRIPT_URL.indexOf('PASTE_') === 0) return;
    fetch(APPS_SCRIPT_URL + '?all=1&t=' + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(list){
        list.sort(function(a,b){ return b.time - a.time; });
        list = list.slice(0, 15);
        adminListEl.innerHTML = '';
        list.forEach(function(item){
          var row = document.createElement('div');
          row.className = 'admin-row' + (item.status === 'hidden' ? ' hidden' : '');
          var txt = document.createElement('div');
          txt.className = 'txt';
          txt.innerHTML = item.poem.slice(0, 24) + (item.poem.length > 24 ? '…' : '') +
            '<small>' + item.author + '</small>';
          var btn = document.createElement('button');
          var isHidden = item.status === 'hidden';
          btn.textContent = isHidden ? '恢復' : '下架';
          btn.onclick = function(){
            var action = isHidden ? 'unhide' : 'hide';
            fetch(APPS_SCRIPT_URL + '?action=' + action + '&id=' + encodeURIComponent(item.id))
              .then(function(){ renderAdminIfOpen(); });
          };
          row.appendChild(txt);
          row.appendChild(btn);
          adminListEl.appendChild(row);
        });
      });
  }

  poll();
  setInterval(poll, POLL_MS);
</script>
</body>
</html>
