<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>詩句牆</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0E1A;
    --paper:#F4EDE0;
    --magenta:#FF6FA5;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; height:100%; overflow:hidden;
    background:var(--ink);
    color:var(--paper);
    font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  }
  .stage{
    position:relative;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* 海報：顏色滿版鋪滿整個畫面，直角，無光暈，直接出現不做浮動動畫 */
  .ticket{
    width:100vw;
    height:100vh;
    background:var(--tpl-bg, #123E8C);
    color:var(--tpl-fg, #E8323A);
    border-radius:0;
    padding:9vh 10vw;
    position:relative;
    overflow:hidden;
    opacity:0;
    font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;
    font-weight:500;
    transition:background-color 0.6s ease, color 0.6s ease;
  }
  .ticket.show{
    opacity:1;
  }
  .poster-inner{
    height:100%;
    transition:opacity 0.5s ease;
  }

  .author-tag{
    position:absolute;
    left:50%; bottom:20px;
    font-size:40px;
    font-weight:500;
    letter-spacing:1px;
    display:inline-block;
    transform:translateX(-50%) scaleX(0.6);
  }

  /* 短句：單行大字，字寬拉長60%，並用JS動態撐滿版面寬度 */
  .tpl-single{
    height:100%;
    display:flex;
    align-items:flex-start;
  }
  .tpl-single .line{
    display:inline-block;
    white-space:nowrap;
    line-height:1.15;
    font-weight:500;
    transform:scaleX(0.6);
    transform-origin:left;
  }

  /* 中等長度：置中多行，每行底線，字寬拉長至60%（窄長），整體字級加大120% */
  .tpl-underlined{
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    align-items:center;
    gap:18px;
  }
  .tpl-underlined .line{
    display:inline-block;
    font-size:clamp(54px, 7.6vw, 100px);
    font-weight:500;
    border-bottom:2px solid currentColor;
    padding-bottom:0.5px;
    transform:scaleX(0.6);
  }

  /* 長句：左對齊多行，緊湊堆疊，字寬壓扁至120%（扁寬），整體字級加大120% */
  .tpl-plain{
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    align-items:flex-start;
    gap:6px;
  }
  .tpl-plain .line{
    display:inline-block;
    font-size:clamp(40px, 5.1vw, 70px);
    font-weight:500;
    line-height:1.3;
    transform:scaleX(1.2);
    transform-origin:left;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="ticket" id="ticket">
      <div class="poster-inner" id="posterInner"></div>
    </div>
  </div>

<script>
  // TODO: 部署 Apps Script 後，把網址貼在這裡
  var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbywrbT-ehHvpV60g1RmNGb6DaXWZDCTkuY8ZL0jdZz_2Piz4eJUzQSHOmOLTDyTZ6K_/exec";
  var POLL_MS = 4000;
  var MIN_DISPLAY_MS = 15000; // 每則詩句停留時間
  var FADE_MS = 500; // 切換到下一句時的淡出淡入時間

  var seenIds = new Set();
  var queue = [];
  var allPoems = []; // 所有目前可見的詩句，新的照順序播完之後從這裡隨機重播，播放才不會斷
  var randomBag = []; // 洗牌後的抽卡池，一輪抽完才重新洗牌，同一輪內不會重複
  var lastShownId = null;
  var showing = false;
  var ticketEl = document.getElementById('ticket');
  var posterInnerEl = document.getElementById('posterInner');

  // 排版依文字長度決定（見 pickLayout_），顏色則是同一組連續出現 5 句後才換下一組（不是每句隨機）
  var COLOR_PALETTE = [
    { bg:'#123E8C', fg:'#E8323A' }, // 藍底紅字
    { bg:'#7A1010', fg:'#E8323A' }, // 深紅底紅字
    { bg:'#0A0A0A', fg:'#C13FD6' }  // 黑底紫字
  ];
  var COLOR_STREAK = 10; // 同一組顏色連續出現幾句才換下一組
  var colorIndex = 0;
  var colorUseCount = 0;

  function nextColor_(){
    if (colorUseCount >= COLOR_STREAK) {
      colorIndex = (colorIndex + 1) % COLOR_PALETTE.length;
      colorUseCount = 0;
    }
    colorUseCount++;
    return COLOR_PALETTE[colorIndex];
  }

  function escapeHtml_(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // 依中文標點把詩句拆成好幾行
  function splitPoemLines_(text){
    var parts = text.match(/[^，。！？；、\n]+[，。！？；、]?/g);
    return (parts && parts.length) ? parts.map(function(s){ return s.trim(); }).filter(Boolean) : [text];
  }

  // 單行大字：動態算字級，讓文字在套用 scaleX 窄化後仍能撐滿版面寬度
  // 原理：先用一個基準字級量測文字自然寬度，反推需要多大字級，
  // 讓「自然寬度 × scaleX」剛好等於版面可用寬度
  function fitLineToWidth_(lineEl, targetWidth, scaleX){
    var probeSize = 100;
    lineEl.style.transform = 'none';
    lineEl.style.fontSize = probeSize + 'px';
    var measured = lineEl.offsetWidth;
    if (measured <= 0) return;
    var safeTargetWidth = targetWidth * 0.94; // 留一點安全邊界，避免頂到邊緣被裁切
    var neededSize = probeSize * (safeTargetWidth / scaleX) / measured;
    neededSize = Math.max(20, Math.min(neededSize, 260)); // 安全上下限，避免字數極端時跑出誇張數字
    lineEl.style.fontSize = neededSize + 'px';
    lineEl.style.transform = 'scaleX(' + scaleX + ')';
  }

  // 依拆出來的行數決定用哪種排版：
  // 1 行 → 單行大字／2~3 行 → 置中底線／4 行以上 → 左對齊緊湊堆疊
  function pickLayout_(lines){
    if (lines.length <= 1) return 'single';
    if (lines.length <= 3) return 'underlined';
    return 'plain';
  }

  function renderPoster(item){
    var color = nextColor_();
    ticketEl.style.setProperty('--tpl-bg', color.bg);
    ticketEl.style.setProperty('--tpl-fg', color.fg);

    var lines = splitPoemLines_(item.poem);
    var layout = pickLayout_(lines);
    var wrapClass = layout === 'single' ? 'tpl-single'
                  : layout === 'underlined' ? 'tpl-underlined'
                  : 'tpl-plain';

    var linesHtml = lines.map(function(l){
      return '<div class="line">' + escapeHtml_(l) + '</div>';
    }).join('');

    posterInnerEl.innerHTML =
      '<div class="' + wrapClass + '">' + linesHtml + '</div>' +
      '<div class="author-tag">' + escapeHtml_(item.author) + '</div>';

    if (layout === 'single') {
      var lineEl = posterInnerEl.querySelector('.tpl-single .line');
      var availableWidth = posterInnerEl.clientWidth;
      if (lineEl && availableWidth > 0) {
        fitLineToWidth_(lineEl, availableWidth, 0.6);
      }
    } else {
      fitBlockToHeight_(posterInnerEl.querySelector('.' + wrapClass), posterInnerEl.clientHeight);
    }
  }

  // 多行版面（置中底線／左對齊堆疊）如果行數多、超出畫面高度，
  // 整體等比縮小字級，避免文字被裁掉
  function fitBlockToHeight_(blockEl, availableHeight){
    if (!blockEl || availableHeight <= 0) return;
    var actualHeight = blockEl.scrollHeight;
    if (actualHeight <= availableHeight) return;
    var ratio = availableHeight / actualHeight * 0.94; // 留一點餘裕
    var lines = blockEl.querySelectorAll('.line');
    lines.forEach(function(line){
      var currentSize = parseFloat(getComputedStyle(line).fontSize);
      line.style.fontSize = Math.max(16, currentSize * ratio) + 'px';
    });
  }

  function shuffle_(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // 從目前已知的詩句裡抽一句：洗牌排好順序，一輪播完才重新洗牌，
  // 這樣同一輪內每句都會輪到一次，不會一直重複到同一句
  function pickRandomPoem_(){
    if (allPoems.length === 0) return null;
    if (allPoems.length === 1) return allPoems[0];

    if (randomBag.length === 0) {
      randomBag = shuffle_(allPoems);
      // 避免重新洗牌後第一張剛好跟上一句銜接重複
      if (randomBag[0].id === lastShownId) {
        var tmp = randomBag[0];
        randomBag[0] = randomBag[1];
        randomBag[1] = tmp;
      }
    }
    return randomBag.shift();
  }

  function showNext(){
    if (showing) return;

    var item = queue.length > 0 ? queue.shift() : pickRandomPoem_();
    if (!item) return; // 還沒有任何投稿，先不顯示

    showing = true;
    lastShownId = item.id;

    var isFirstReveal = !ticketEl.classList.contains('show');
    if (isFirstReveal) {
      // 第一句：直接出現，不做淡出淡入（那是給整個畫面從無到有用的）
      renderPoster(item);
      ticketEl.classList.add('show');
      holdThenNext_();
    } else {
      // 之後每一句：先把目前文字淡出，換顏色換內容，再淡入
      posterInnerEl.style.opacity = '0';
      setTimeout(function(){
        renderPoster(item);
        posterInnerEl.style.opacity = '1';
        holdThenNext_();
      }, FADE_MS);
    }
  }

  function holdThenNext_(){
    setTimeout(function(){
      showing = false;
      showNext();
    }, MIN_DISPLAY_MS);
  }

  function poll(){
    if (APPS_SCRIPT_URL.indexOf('PASTE_') === 0) return;
    fetch(APPS_SCRIPT_URL + '?t=' + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(list){
        list.sort(function(a,b){ return a.time - b.time; });

        var visibleIds = {};
        list.forEach(function(item){
          visibleIds[item.id] = true;

          var alreadyKnown = allPoems.some(function(p){ return p.id === item.id; });
          if (!alreadyKnown) {
            // 全新投稿（之前沒看過）才排進優先播放佇列；
            // 如果是被下架後又恢復上架的舊投稿，只加回隨機池，不打斷目前排隊順序
            if (!seenIds.has(item.id)) {
              queue.push(item);
            }
            allPoems.push(item);
            seenIds.add(item.id);
          }
        });

        // 同步下架狀態：如果有句子在 admin.html 被下架了，這裡也要跟著移除，
        // 不然還是可能被隨機抽到
        allPoems = allPoems.filter(function(p){ return visibleIds[p.id]; });
        queue = queue.filter(function(p){ return visibleIds[p.id]; });
        randomBag = randomBag.filter(function(p){ return visibleIds[p.id]; });

        showNext();
      })
      .catch(function(err){ console.error('poll error', err); });
  }

  // 等 Noto Serif TC 真的載入完成才開始播放，
  // 不然「單行大字」那個排版量測寬度時可能還在用備援字體，
  // 字體換好之後寬度對不起來，看起來就會「跑版」
  function start_(){
    poll();
    setInterval(poll, POLL_MS);
  }
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(start_);
  } else {
    start_();
  }
</script>
</body>
</html>
