<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>詩句牆</title>
<style>
  :root{
    --ink:#0B0E1A;
    --paper:#F4EDE0;
    --amber:#FFB84D;
    --cyan:#5EEAD4;
    --magenta:#FF6FA5;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; height:100%; overflow:hidden;
    background:var(--ink);
    color:var(--paper);
    font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  }
  .stage{
    position:relative;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .idle{
    color:rgba(244,237,224,0.25);
    font-size:22px;
    letter-spacing:4px;
  }

  /* 海報卡片：滿版、直角、無光暈，跟參考圖一樣是「一張海報」而不是「浮動卡片」 */
  .ticket{
    width:min(80vw, 960px);
    height:min(72vh, 680px);
    background:var(--tpl-bg, #F4EDE0);
    color:var(--tpl-fg, #0B0E1A);
    border-radius:0;
    padding:48px 56px;
    text-align:left;
    opacity:0;
    transform:translateY(16px);
    transition:opacity 0.5s ease, transform 0.5s ease;
    position:relative;
    overflow:hidden;
  }
  .ticket.show{
    opacity:1;
    transform:translateY(0);
  }

  /* ---- 模板一：稿紙分隔線（呼應參考圖1） ---- */
  .tpl-ruled{ height:100%; display:flex; flex-direction:column; }
  .ruled-author{
    font-size:15px;
    font-weight:800;
    letter-spacing:2px;
    margin-bottom:26px;
  }
  .ruled-lines{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:2px;
  }
  .ruled-line{
    font-size:clamp(24px, 3.6vw, 46px);
    font-weight:500;
    line-height:1.55;
    border-bottom:3px solid var(--tpl-fg, #0B0E1A);
    padding-bottom:6px;
  }
  .ruled-line b{ font-weight:800; }
  .ruled-footer{
    margin-top:20px;
    font-size:12px;
    letter-spacing:2px;
    opacity:0.55;
  }

  /* ---- 模板二：滿版粗體＋底部條碼帶（呼應參考圖2） ---- */
  .tpl-barcode{ height:100%; display:flex; flex-direction:column; }
  .barcode-headline{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:2px;
  }
  .barcode-line{
    font-size:clamp(26px, 4vw, 52px);
    font-weight:800;
    line-height:1.25;
  }
  .barcode-footer{
    margin:24px -56px -48px;
    background:var(--tpl-fg, #0B0E1A);
    color:var(--tpl-bg, #F4EDE0);
    padding:14px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
  }
  .barcode-caption{
    font-size:11px;
    letter-spacing:1px;
    opacity:0.85;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  /* ---- 模板三：編號色塊＋標籤（呼應參考圖3） ---- */
  .tpl-badge{ height:100%; display:flex; flex-direction:column; }
  .badge-toprow{
    display:flex;
    align-items:flex-start;
    gap:16px;
  }
  .badge-num{
    background:var(--tpl-fg, #0B0E1A);
    color:var(--tpl-bg, #F4EDE0);
    font-weight:900;
    font-size:20px;
    padding:6px 12px;
    flex-shrink:0;
  }
  .badge-headline{
    flex:1;
    font-size:clamp(24px, 3.6vw, 44px);
    font-weight:800;
    line-height:1.3;
  }
  .badge-tag{
    background:var(--tpl-fg, #0B0E1A);
    color:var(--tpl-bg, #F4EDE0);
    font-size:11px;
    font-weight:700;
    letter-spacing:1px;
    padding:5px 10px;
    flex-shrink:0;
    white-space:nowrap;
  }
  .badge-rest{
    margin-top:20px;
    padding-top:16px;
    border-top:5px solid var(--tpl-fg, #0B0E1A);
    font-size:clamp(18px, 2.6vw, 28px);
    font-weight:500;
    display:flex;
    flex-direction:column;
    gap:6px;
    flex:1;
    justify-content:center;
  }

  .archive{
    position:absolute;
    bottom:20px;
    left:0; right:0;
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    padding:0 40px;
    max-height:60px;
    overflow:hidden;
    opacity:0.5;
  }
  .chip{
    font-size:12px;
    color:rgba(244,237,224,0.6);
    border:1px solid rgba(244,237,224,0.15);
    border-radius:999px;
    padding:5px 12px;
    white-space:nowrap;
    max-width:220px;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  /* 管理員面板：預設隱藏，按 H 開關 */
  .admin{
    position:fixed;
    top:16px; right:16px;
    width:340px;
    max-height:80vh;
    overflow-y:auto;
    background:rgba(11,14,26,0.95);
    border:1px solid var(--magenta);
    border-radius:12px;
    padding:14px;
    display:none;
    font-size:13px;
    z-index:999;
  }
  .admin.open{display:block;}
  .admin h3{margin:0 0 10px;color:var(--magenta);font-size:14px;}
  .admin-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 0;
    border-bottom:1px solid rgba(244,237,224,0.1);
  }
  .admin-row .txt{flex:1;color:rgba(244,237,224,0.8);}
  .admin-row .txt small{display:block;color:var(--amber);}
  .admin-row button{
    background:transparent;
    border:1px solid var(--magenta);
    color:var(--magenta);
    border-radius:6px;
    padding:4px 8px;
    font-size:12px;
    cursor:pointer;
  }
  .admin-row.hidden .txt{opacity:0.4;text-decoration:line-through;}
  .admin-row.hidden button{border-color:var(--cyan);color:var(--cyan);}
  .hint{
    position:fixed; bottom:8px; right:12px;
    font-size:11px; color:rgba(244,237,224,0.15);
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="idle" id="idle">✦ 等待第一句 ✦</div>
    <div class="ticket" id="ticket">
      <div class="poster-inner" id="posterInner"></div>
    </div>
  </div>
  <div class="archive" id="archive"></div>

  <div class="admin" id="admin">
    <h3>管理面板（按 H 關閉）</h3>
    <div id="adminList"></div>
  </div>
  <div class="hint">按 H 開啟管理面板</div>

<script>
  // TODO: 部署 Apps Script 後，把網址貼在這裡
  var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbywrbT-ehHvpV60g1RmNGb6DaXWZDCTkuY8ZL0jdZz_2Piz4eJUzQSHOmOLTDyTZ6K_/exec";
  var POLL_MS = 4000;
  var MIN_DISPLAY_MS = 4500; // 每則詩句最少停留時間

  var seenIds = new Set();
  var queue = [];
  var showing = false;
  var archiveEl = document.getElementById('archive');
  var idleEl = document.getElementById('idle');
  var ticketEl = document.getElementById('ticket');
  var posterInnerEl = document.getElementById('posterInner');

  var BRAND_TAG = '浪漫銀河大舞廳 · 詩戀投影';

  // ---- 隨機海報排版 ----
  // 三種結構分別對應三張參考圖，顏色組合隨機挑，但結構是固定的（不是亂套樣式）
  var POSTER_TEMPLATES = [
    { type:'ruled',   bg:'#EDE7DA', fg:'#1E2A6E' }, // 米白配靛藍
    { type:'barcode', bg:'#6FBE8C', fg:'#0B0E1A' }, // 草綠配黑
    { type:'badge',   bg:'#EDE7DA', fg:'#0B0E1A' }, // 米白配黑
    { type:'ruled',   bg:'#0B0E1A', fg:'#5EEAD4' }, // 品牌深藍配青
    { type:'badge',   bg:'#FF6FA5', fg:'#0B0E1A' }  // 桃紅配黑
  ];
  var poemCounter = 0;

  function escapeHtml_(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // 依中文標點把詩句拆成好幾行，模擬海報式的分行排版
  function splitPoemLines_(text){
    var parts = text.match(/[^，。！？；、\n]+[，。！？；、]?/g);
    return (parts && parts.length) ? parts.map(function(s){ return s.trim(); }).filter(Boolean) : [text];
  }

  // 隨機挑一小段文字加粗，模擬參考圖1裡「重點字加粗、不是整行粗」的效果
  function emphasizeLine_(line){
    var chars = line.split('');
    if (chars.length <= 2) return escapeHtml_(line);
    var segLen = Math.min(chars.length - 1, 2 + Math.floor(Math.random() * 3)); // 2~4 個字
    var maxStart = chars.length - segLen;
    var start = Math.floor(Math.random() * (maxStart + 1));
    var before = chars.slice(0, start).join('');
    var mid = chars.slice(start, start + segLen).join('');
    var after = chars.slice(start + segLen).join('');
    return escapeHtml_(before) + '<b>' + escapeHtml_(mid) + '</b>' + escapeHtml_(after);
  }

  function buildBarcodeSvg_(color){
    var bars = '';
    var x = 0;
    for (var i = 0; i < 26; i++){
      var w = 1 + Math.random() * 3;
      if (Math.random() < 0.55) {
        bars += '<rect x="' + x + '" y="0" width="' + w + '" height="24" fill="' + color + '"/>';
      }
      x += w + 1.5;
    }
    return '<svg viewBox="0 0 ' + x + ' 24" style="height:18px;width:auto;flex-shrink:0;">' + bars + '</svg>';
  }

  // 模板一：稿紙分隔線
  function renderRuled_(item){
    var lines = splitPoemLines_(item.poem);
    var linesHtml = lines.map(function(line){
      return '<div class="ruled-line">' + emphasizeLine_(line) + '</div>';
    }).join('');
    return (
      '<div class="tpl-ruled">' +
        '<div class="ruled-author">' + escapeHtml_(item.author) + '</div>' +
        '<div class="ruled-lines">' + linesHtml + '</div>' +
        '<div class="ruled-footer">' + escapeHtml_(BRAND_TAG) + '</div>' +
      '</div>'
    );
  }

  // 模板二：滿版粗體＋底部條碼帶
  function renderBarcode_(tpl, item){
    var lines = splitPoemLines_(item.poem);
    var linesHtml = lines.map(function(line){
      return '<div class="barcode-line">' + escapeHtml_(line) + '</div>';
    }).join('');
    var caption = escapeHtml_(item.poem) + '　' + escapeHtml_(item.author);
    return (
      '<div class="tpl-barcode">' +
        '<div class="barcode-headline">' + linesHtml + '</div>' +
        '<div class="barcode-footer">' +
          '<div class="barcode-caption">' + caption + '</div>' +
          buildBarcodeSvg_(tpl.bg) +
        '</div>' +
      '</div>'
    );
  }

  // 模板三：編號色塊＋標籤
  function renderBadge_(item){
    poemCounter++;
    var num = String(poemCounter).padStart(2, '0');
    var lines = splitPoemLines_(item.poem);
    var mainLine = lines[0] || item.poem;
    var restLines = lines.slice(1);
    var restHtml = restLines.map(function(l){
      return '<div>' + escapeHtml_(l) + '</div>';
    }).join('');
    return (
      '<div class="tpl-badge">' +
        '<div class="badge-toprow">' +
          '<div class="badge-num">' + num + '</div>' +
          '<div class="badge-headline">' + escapeHtml_(mainLine) + '</div>' +
          '<div class="badge-tag">' + escapeHtml_(item.author) + '</div>' +
        '</div>' +
        '<div class="badge-rest">' + restHtml + '</div>' +
      '</div>'
    );
  }

  function renderPoster(item){
    var tpl = POSTER_TEMPLATES[Math.floor(Math.random() * POSTER_TEMPLATES.length)];
    ticketEl.style.setProperty('--tpl-bg', tpl.bg);
    ticketEl.style.setProperty('--tpl-fg', tpl.fg);

    var html;
    if (tpl.type === 'ruled') html = renderRuled_(item);
    else if (tpl.type === 'barcode') html = renderBarcode_(tpl, item);
    else html = renderBadge_(item);

    posterInnerEl.innerHTML = html;
  }

  function addToArchive(poem, author){
    var chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = poem.slice(0, 14) + (poem.length > 14 ? '…' : '') + '　' + author;
    archiveEl.appendChild(chip);
    while (archiveEl.children.length > 10) {
      archiveEl.removeChild(archiveEl.firstChild);
    }
  }

  function showNext(){
    if (showing || queue.length === 0) return;
    showing = true;
    idleEl.style.display = 'none';

    var item = queue.shift();
    renderPoster(item);

    ticketEl.classList.remove('show');
    void ticketEl.offsetWidth; // 強制 reflow 讓動畫重新觸發
    ticketEl.classList.add('show');

    setTimeout(function(){
      ticketEl.classList.remove('show');
      addToArchive(item.poem, item.author);
      setTimeout(function(){
        showing = false;
        showNext();
      }, 500);
    }, MIN_DISPLAY_MS);
  }

  function poll(){
    if (APPS_SCRIPT_URL.indexOf('PASTE_') === 0) return;
    fetch(APPS_SCRIPT_URL + '?t=' + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(list){
        list.sort(function(a,b){ return a.time - b.time; });
        list.forEach(function(item){
          if (!seenIds.has(item.id)) {
            seenIds.add(item.id);
            queue.push(item);
          }
        });
        showNext();
        renderAdminIfOpen();
      })
      .catch(function(err){ console.error('poll error', err); });
  }

  // ---- 管理面板 ----
  var adminOpen = false;
  var adminEl = document.getElementById('admin');
  var adminListEl = document.getElementById('adminList');

  document.addEventListener('keydown', function(e){
    if (e.key.toLowerCase() === 'h') {
      adminOpen = !adminOpen;
      adminEl.classList.toggle('open', adminOpen);
      if (adminOpen) renderAdminIfOpen();
    }
  });

  function renderAdminIfOpen(){
    if (!adminOpen || APPS_SCRIPT_URL.indexOf('PASTE_') === 0) return;
    fetch(APPS_SCRIPT_URL + '?all=1&t=' + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(list){
        list.sort(function(a,b){ return b.time - a.time; });
        list = list.slice(0, 15);
        adminListEl.innerHTML = '';
        list.forEach(function(item){
          var row = document.createElement('div');
          row.className = 'admin-row' + (item.status === 'hidden' ? ' hidden' : '');
          var txt = document.createElement('div');
          txt.className = 'txt';
          txt.innerHTML = item.poem.slice(0, 24) + (item.poem.length > 24 ? '…' : '') +
            '<small>' + item.author + '</small>';
          var btn = document.createElement('button');
          var isHidden = item.status === 'hidden';
          btn.textContent = isHidden ? '恢復' : '下架';
          btn.onclick = function(){
            var action = isHidden ? 'unhide' : 'hide';
            fetch(APPS_SCRIPT_URL + '?action=' + action + '&id=' + encodeURIComponent(item.id))
              .then(function(){ renderAdminIfOpen(); });
          };
          row.appendChild(txt);
          row.appendChild(btn);
          adminListEl.appendChild(row);
        });
      });
  }

  poll();
  setInterval(poll, POLL_MS);
</script>
</body>
</html>
