<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>詩句牆</title>
<style>
  :root{
    --ink:#0B0E1A;
    --paper:#F4EDE0;
    --amber:#FFB84D;
    --cyan:#5EEAD4;
    --magenta:#FF6FA5;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; height:100%; overflow:hidden;
    background:
      radial-gradient(circle at 15% 20%, rgba(255,184,77,0.10), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(94,234,212,0.10), transparent 45%),
      var(--ink);
    color:var(--paper);
    font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  }
  .stage{
    position:relative;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .idle{
    color:rgba(244,237,224,0.25);
    font-size:22px;
    letter-spacing:4px;
  }
  .ticket{
    width:min(70vw, 900px);
    background:rgba(244,237,224,0.04);
    border:1px solid rgba(255,184,77,0.5);
    border-radius:22px;
    padding:56px 64px;
    text-align:center;
    opacity:0;
    transform:translateY(24px) scale(0.96);
    transition:opacity 0.7s ease, transform 0.7s cubic-bezier(.2,.9,.3,1.2);
    box-shadow:0 0 0 rgba(255,184,77,0);
  }
  .ticket.show{
    opacity:1;
    transform:translateY(0) scale(1);
    box-shadow:0 0 60px rgba(255,184,77,0.12);
  }
  .ticket.speaking{
    border-color:var(--cyan);
    box-shadow:0 0 80px rgba(94,234,212,0.18);
  }
  .poem-text{
    font-size:clamp(28px, 4vw, 52px);
    line-height:1.6;
    white-space:pre-wrap;
    margin:0 0 28px;
  }
  .author{
    font-size:18px;
    color:var(--amber);
    letter-spacing:2px;
  }
  .author::before{content:"— ";}

  .archive{
    position:absolute;
    bottom:24px;
    left:0; right:0;
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    padding:0 40px;
    max-height:120px;
    overflow:hidden;
    opacity:0.5;
  }
  .chip{
    font-size:12px;
    color:rgba(244,237,224,0.6);
    border:1px solid rgba(244,237,224,0.15);
    border-radius:999px;
    padding:5px 12px;
    white-space:nowrap;
    max-width:220px;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  /* 管理員面板：預設隱藏，按 H 開關 */
  .admin{
    position:fixed;
    top:16px; right:16px;
    width:340px;
    max-height:80vh;
    overflow-y:auto;
    background:rgba(11,14,26,0.95);
    border:1px solid var(--magenta);
    border-radius:12px;
    padding:14px;
    display:none;
    font-size:13px;
    z-index:999;
  }
  .admin.open{display:block;}
  .admin h3{margin:0 0 10px;color:var(--magenta);font-size:14px;}
  .admin-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 0;
    border-bottom:1px solid rgba(244,237,224,0.1);
  }
  .admin-row .txt{flex:1;color:rgba(244,237,224,0.8);}
  .admin-row .txt small{display:block;color:var(--amber);}
  .admin-row button{
    background:transparent;
    border:1px solid var(--magenta);
    color:var(--magenta);
    border-radius:6px;
    padding:4px 8px;
    font-size:12px;
    cursor:pointer;
  }
  .admin-row.hidden .txt{opacity:0.4;text-decoration:line-through;}
  .admin-row.hidden button{border-color:var(--cyan);color:var(--cyan);}
  .hint{
    position:fixed; bottom:8px; right:12px;
    font-size:11px; color:rgba(244,237,224,0.15);
  }

  .fx-panel{
    position:fixed;
    bottom:24px; left:24px;
    display:flex;
    gap:8px;
    z-index:998;
  }
  .fx-btn{
    background:rgba(244,237,224,0.05);
    border:1px solid rgba(244,237,224,0.25);
    color:rgba(244,237,224,0.7);
    border-radius:999px;
    padding:8px 16px;
    font-size:13px;
    letter-spacing:1px;
    cursor:pointer;
    font-family:inherit;
  }
  .fx-btn.active{
    border-color:var(--cyan);
    color:var(--cyan);
    background:rgba(94,234,212,0.08);
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="idle" id="idle">✦ 等待第一句 ✦</div>
    <div class="ticket" id="ticket">
      <p class="poem-text" id="poemText"></p>
      <div class="author" id="authorText"></div>
    </div>
  </div>
  <div class="archive" id="archive"></div>

  <div class="admin" id="admin">
    <h3>管理面板（按 H 關閉）</h3>
    <div id="adminList"></div>
  </div>
  <div class="hint">按 H 開啟管理面板</div>

  <div class="fx-panel" id="fxPanel">
    <button class="fx-btn" data-fx="none">原聲</button>
    <button class="fx-btn" data-fx="robotA">機器人A</button>
    <button class="fx-btn" data-fx="robotB">機器人B</button>
    <button class="fx-btn" data-fx="robotC">機器人C</button>
    <button class="fx-btn" data-fx="glitch">故障</button>
    <button class="fx-btn" data-fx="robotGlitch">機器人+故障</button>
    <button class="fx-btn" data-fx="space">太空迴音</button>
  </div>

<script>
  // TODO: 部署 Apps Script 後，把網址貼在這裡
  var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbywrbT-ehHvpV60g1RmNGb6DaXWZDCTkuY8ZL0jdZz_2Piz4eJUzQSHOmOLTDyTZ6K_/exec";
  var POLL_MS = 4000;
  var MIN_DISPLAY_MS = 4500; // 每則詩句最少停留時間（不含朗讀）

  var seenIds = new Set();
  var queue = [];
  var showing = false;
  var archiveEl = document.getElementById('archive');
  var idleEl = document.getElementById('idle');
  var ticketEl = document.getElementById('ticket');
  var poemTextEl = document.getElementById('poemText');
  var authorTextEl = document.getElementById('authorText');

  // ---- 語音設定 ----
  // provider: 'browser'（免費，瀏覽器內建） 或 'azure'（雲端語音，音質較好，需申請金鑰）
  var TTS_CONFIG = {
    provider: 'azure',
    rate: 0.8,                // 語速，1 = 正常。數字越小越慢，例如 0.7 明顯變慢
    azureKey: '',             // 不要在這裡填金鑰！改用下面的輸入視窗
    azureRegion: 'eastasia',  // 你建立資源時選的地區
    azureVoice: 'zh-TW-HsiaoChenNeural' // 女聲；男聲可用 'zh-TW-YunJheNeural'
  };
  var currentEffect = 'none'; // 預設原聲，可用左下角按鈕切換

  // 金鑰改成第一次打開時用跳出視窗輸入，只存在這台瀏覽器裡（localStorage），
  // 不會寫進檔案、也不會上傳到 GitHub。
  (function initAzureKey(){
    if (TTS_CONFIG.provider !== 'azure') return;
    var saved = localStorage.getItem('poem_wall_azure_key');
    if (saved) {
      TTS_CONFIG.azureKey = saved;
      return;
    }
    var entered = prompt('請輸入 Azure Speech 金鑰（只會存在這台電腦的瀏覽器裡）：');
    if (entered) {
      TTS_CONFIG.azureKey = entered.trim();
      localStorage.setItem('poem_wall_azure_key', TTS_CONFIG.azureKey);
    }
  })();

  var voices = [];
  function loadVoices(){ voices = speechSynthesis.getVoices(); }
  loadVoices();
  if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = loadVoices;
  }
  function pickVoice(){
    return voices.find(function(v){ return v.lang === 'zh-TW'; })
        || voices.find(function(v){ return v.lang && v.lang.indexOf('zh') === 0; })
        || null;
  }

  function speakBrowser(text){
    return new Promise(function(resolve){
      if (!('speechSynthesis' in window)) { resolve(); return; }
      var u = new SpeechSynthesisUtterance(text);
      var v = pickVoice();
      if (v) u.voice = v;
      u.lang = 'zh-TW';
      u.rate = TTS_CONFIG.rate;
      u.onend = resolve;
      u.onerror = resolve;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    });
  }

  function escapeXml_(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
             .replace(/"/g,'&quot;').replace(/'/g,'&apos;');
  }

  var audioCtx = null;
  function getAudioCtx(){
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  function fetchVoiceBuffer(text){
    var rateValue = TTS_CONFIG.rate; // Azure 吃倍數格式，例如 0.5、1、1.5，不要用百分比字串
    var ssml = '<speak version="1.0" xml:lang="zh-TW">' +
      '<voice xml:lang="zh-TW" xml:gender="Female" name="' + TTS_CONFIG.azureVoice + '">' +
      '<prosody rate="' + rateValue + '">' + escapeXml_(text) + '</prosody>' +
      '</voice></speak>';

    return fetch('https://' + TTS_CONFIG.azureRegion + '.tts.speech.microsoft.com/cognitiveservices/v1', {
      method: 'POST',
      headers: {
        'Ocp-Apim-Subscription-Key': TTS_CONFIG.azureKey,
        'Content-Type': 'application/ssml+xml',
        'X-Microsoft-OutputFormat': 'audio-16khz-128kbitrate-mono-mp3'
      },
      body: ssml
    })
    .then(function(r){
      if (!r.ok) throw new Error('azure_tts_failed');
      return r.arrayBuffer();
    })
    .then(function(arrayBuffer){
      return getAudioCtx().decodeAudioData(arrayBuffer);
    });
  }

  // ---- 變聲效果 ----
  function makeCrushCurve_(bits){
    var curve = new Float32Array(65536);
    var steps = Math.pow(2, bits);
    for (var i = 0; i < 65536; i++){
      var x = i / 32768 - 1;
      curve[i] = Math.round(x * steps) / steps;
    }
    return curve;
  }

  function makeReverbImpulse_(ctx, duration, decay){
    var rate = ctx.sampleRate;
    var length = Math.floor(rate * duration);
    var impulse = ctx.createBuffer(2, length, rate);
    for (var ch = 0; ch < 2; ch++){
      var data = impulse.getChannelData(ch);
      for (var i = 0; i < length; i++){
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
      }
    }
    return impulse;
  }

  // 機器人／合成器感：ring modulation + 帶通濾波 + 輕微位元壓縮
  // preset: A 冷酷金屬（預設）／B 低沉厚重／C 尖銳刺耳
  var ROBOT_PRESETS = {
    A: { carrierFreq: 45, filterFreq: 1400, filterQ: 0.8, crushBits: 7 },
    B: { carrierFreq: 22, filterFreq: 750,  filterQ: 1.2, crushBits: 6 },
    C: { carrierFreq: 85, filterFreq: 2200, filterQ: 0.6, crushBits: 5 }
  };

  function chainRobot_(ctx, source, preset){
    var p = ROBOT_PRESETS[preset] || ROBOT_PRESETS.A;

    var carrier = ctx.createOscillator();
    carrier.type = 'sine';
    carrier.frequency.value = p.carrierFreq;

    var ring = ctx.createGain();
    ring.gain.value = 0;
    carrier.connect(ring.gain);
    source.connect(ring);

    var filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = p.filterFreq;
    filter.Q.value = p.filterQ;

    var shaper = ctx.createWaveShaper();
    shaper.curve = makeCrushCurve_(p.crushBits);

    ring.connect(filter);
    filter.connect(shaper);
    carrier.start();

    return { output: shaper, extraNodes: [carrier] };
  }

  // 故障 Glitch 感：重度位元壓縮 + 隨機斷音
  function chainGlitch_(ctx, source){
    var shaper = ctx.createWaveShaper();
    shaper.curve = makeCrushCurve_(4);

    var gate = ctx.createGain();
    source.connect(shaper);
    shaper.connect(gate);

    return { output: gate, gateNode: gate };
  }

  // 機器人 + 故障 組合：先過機器人震動，再疊故障斷音
  function chainRobotGlitch_(ctx, source, preset){
    var robot = chainRobot_(ctx, source, preset);

    var gate = ctx.createGain();
    robot.output.connect(gate);

    return { output: gate, gateNode: gate, extraNodes: robot.extraNodes };
  }

  function scheduleGlitchGate_(ctx, gateNode, duration){
    var t = ctx.currentTime;
    gateNode.gain.setValueAtTime(1, t);
    var stepLen = 0.12;
    var steps = Math.floor(duration / stepLen);
    for (var i = 0; i < steps; i++){
      var when = t + i * stepLen + Math.random() * 0.04;
      if (Math.random() < 0.3) {
        gateNode.gain.setValueAtTime(0, when);
        gateNode.gain.setValueAtTime(1, when + 0.03 + Math.random() * 0.05);
      }
    }
  }

  // 太空迴音感：混響 + 回音疊層
  function chainSpace_(ctx, source){
    var convolver = ctx.createConvolver();
    convolver.buffer = makeReverbImpulse_(ctx, 2.5, 2.5);

    var delay = ctx.createDelay(1.0);
    delay.delayTime.value = 0.32;
    var feedback = ctx.createGain();
    feedback.gain.value = 0.38;
    delay.connect(feedback);
    feedback.connect(delay);

    var dry = ctx.createGain(); dry.gain.value = 0.7;
    var wet = ctx.createGain(); wet.gain.value = 0.5;
    var delayWet = ctx.createGain(); delayWet.gain.value = 0.32;
    var merge = ctx.createGain();

    source.connect(dry); dry.connect(merge);
    source.connect(convolver); convolver.connect(wet); wet.connect(merge);
    source.connect(delay); delay.connect(delayWet); delayWet.connect(merge);

    return { output: merge };
  }

  function playWithEffect(buffer, effectType){
    return new Promise(function(resolve){
      var ctx = getAudioCtx();
      var source = ctx.createBufferSource();
      source.buffer = buffer;

      var chain;
      if (effectType === 'robotA') chain = chainRobot_(ctx, source, 'A');
      else if (effectType === 'robotB') chain = chainRobot_(ctx, source, 'B');
      else if (effectType === 'robotC') chain = chainRobot_(ctx, source, 'C');
      else if (effectType === 'glitch') chain = chainGlitch_(ctx, source);
      else if (effectType === 'robotGlitch') chain = chainRobotGlitch_(ctx, source, 'A');
      else if (effectType === 'space') chain = chainSpace_(ctx, source);
      else chain = { output: source }; // 原聲

      chain.output.connect(ctx.destination);
      if (effectType === 'glitch' || effectType === 'robotGlitch') {
        scheduleGlitchGate_(ctx, chain.gateNode, buffer.duration);
      }

      source.onended = function(){
        if (chain.extraNodes) chain.extraNodes.forEach(function(n){ try { n.stop(); } catch(e){} });
        resolve();
      };
      source.start();
    });
  }

  function speakAzure(text){
    return fetchVoiceBuffer(text).then(function(buffer){
      return playWithEffect(buffer, currentEffect);
    }).catch(function(err){
      console.error('Azure TTS 失敗，改用瀏覽器語音', err);
      return speakBrowser(text);
    });
  }

  function speak(text){
    if (TTS_CONFIG.provider === 'azure' && TTS_CONFIG.azureKey && TTS_CONFIG.azureRegion) {
      return speakAzure(text);
    }
    return speakBrowser(text);
  }

  // ---- 效果切換按鈕 ----
  var fxButtons = document.querySelectorAll('.fx-btn');
  function setEffect(fx){
    currentEffect = fx;
    fxButtons.forEach(function(btn){
      btn.classList.toggle('active', btn.dataset.fx === fx);
    });
  }
  fxButtons.forEach(function(btn){
    btn.addEventListener('click', function(){
      setEffect(btn.dataset.fx);
      speak('這是' + btn.textContent + '效果的測試聲音');
    });
  });
  setEffect(currentEffect);

  // 現場測試用：打開瀏覽器主控台（F12），輸入 testVoice("測試句子") 就能立刻聽
  // 也可以指定效果：testVoice("測試句子", "glitch")
  window.testVoice = function(text, fx){
    if (fx) currentEffect = fx;
    speak(text || '這是一段測試語音，聽聽看好不好聽。');
  };

  // 金鑰輸入錯誤時，在主控台輸入 resetAzureKey() 清掉重存，重新整理頁面會再跳出輸入視窗
  window.resetAzureKey = function(){
    localStorage.removeItem('poem_wall_azure_key');
    console.log('已清除，重新整理頁面即可重新輸入金鑰');
  };

  function addToArchive(poem, author){
    var chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = poem.slice(0, 14) + (poem.length > 14 ? '…' : '') + '　' + author;
    archiveEl.appendChild(chip);
    while (archiveEl.children.length > 10) {
      archiveEl.removeChild(archiveEl.firstChild);
    }
  }

  function showNext(){
    if (showing || queue.length === 0) return;
    showing = true;
    idleEl.style.display = 'none';

    var item = queue.shift();
    poemTextEl.textContent = item.poem;
    authorTextEl.textContent = item.author;

    ticketEl.classList.remove('show', 'speaking');
    // 強制 reflow 讓動畫重新觸發
    void ticketEl.offsetWidth;
    ticketEl.classList.add('show');

    setTimeout(function(){
      ticketEl.classList.add('speaking');
      speak(item.poem + '。' + item.author).then(function(){
        ticketEl.classList.remove('speaking');
        setTimeout(function(){
          ticketEl.classList.remove('show');
          addToArchive(item.poem, item.author);
          setTimeout(function(){
            showing = false;
            showNext();
          }, 700);
        }, 500);
      });
    }, 750);
  }

  function poll(){
    if (APPS_SCRIPT_URL.indexOf('PASTE_') === 0) return;
    fetch(APPS_SCRIPT_URL + '?t=' + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(list){
        list.sort(function(a,b){ return a.time - b.time; });
        list.forEach(function(item){
          if (!seenIds.has(item.id)) {
            seenIds.add(item.id);
            queue.push(item);
          }
        });
        showNext();
        renderAdminIfOpen();
      })
      .catch(function(err){ console.error('poll error', err); });
  }

  // ---- 管理面板 ----
  var adminOpen = false;
  var adminEl = document.getElementById('admin');
  var adminListEl = document.getElementById('adminList');

  document.addEventListener('keydown', function(e){
    if (e.key.toLowerCase() === 'h') {
      adminOpen = !adminOpen;
      adminEl.classList.toggle('open', adminOpen);
      if (adminOpen) renderAdminIfOpen();
    }
  });

  function renderAdminIfOpen(){
    if (!adminOpen || APPS_SCRIPT_URL.indexOf('PASTE_') === 0) return;
    fetch(APPS_SCRIPT_URL + '?all=1&t=' + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(list){
        list.sort(function(a,b){ return b.time - a.time; });
        list = list.slice(0, 15);
        adminListEl.innerHTML = '';
        list.forEach(function(item){
          var row = document.createElement('div');
          row.className = 'admin-row' + (item.status === 'hidden' ? ' hidden' : '');
          var txt = document.createElement('div');
          txt.className = 'txt';
          txt.innerHTML = item.poem.slice(0, 24) + (item.poem.length > 24 ? '…' : '') +
            '<small>' + item.author + '</small>';
          var btn = document.createElement('button');
          var isHidden = item.status === 'hidden';
          btn.textContent = isHidden ? '恢復' : '下架';
          btn.onclick = function(){
            var action = isHidden ? 'unhide' : 'hide';
            fetch(APPS_SCRIPT_URL + '?action=' + action + '&id=' + encodeURIComponent(item.id))
              .then(function(){ renderAdminIfOpen(); });
          };
          row.appendChild(txt);
          row.appendChild(btn);
          adminListEl.appendChild(row);
        });
      });
  }

  poll();
  setInterval(poll, POLL_MS);
</script>
</body>
</html>
