<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>寫一句，丟出去</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500&display=swap" rel="stylesheet">
<style>
  @font-face{
    font-family:"Didot Italic";
    src:url("Didot_LT_Std_Italic.otf") format("opentype");
    font-weight:normal;
    font-style:italic;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    min-height:100vh;
    font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;
    font-weight:500;
  }
  body{
    background:var(--bg, #123E8C);
    color:var(--fg, #E8323A);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 28px;
  }

  .wrap{
    width:100%;
    max-width:420px;
  }

  .hero{
    font-family:"Didot Italic", "Times New Roman", serif;
    font-style:italic;
    font-weight:400;
    font-size:clamp(30px, 7vw, 48px);
    line-height:1.15;
    margin:0 0 22px;
    letter-spacing:0.5px;
  }

  .tag{
    display:inline-block;
    font-size:13px;
    letter-spacing:3px;
    font-weight:500;
    transform:scaleX(0.6);
    transform-origin:left;
    margin-bottom:6px;
  }
  h1{
    margin:0 0 8px;
    font-size:44px;
    line-height:1.25;
    font-weight:500;
    display:inline-block;
    transform:scaleX(0.6);
    transform-origin:left;
  }
  p.sub{
    margin:0 0 30px;
    font-size:14px;
    opacity:0.75;
  }

  label{
    display:block;
    font-size:13px;
    letter-spacing:1px;
    margin-bottom:8px;
    opacity:0.85;
  }
  textarea, input[type=text]{
    width:100%;
    background:rgba(0,0,0,0.18);
    border:1.5px solid currentColor;
    border-radius:0;
    color:inherit;
    padding:14px 16px;
    font-size:16px;
    font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;
    font-weight:500;
    margin-bottom:20px;
    outline:none;
  }
  textarea{min-height:130px;resize:vertical;}
  textarea::placeholder, input::placeholder{ color:currentColor; opacity:0.4; }
  textarea:focus, input:focus{ background:rgba(0,0,0,0.3); }
  .count{
    text-align:right;
    font-size:12px;
    opacity:0.5;
    margin-top:-14px;
    margin-bottom:18px;
  }
  button{
    width:100%;
    color:inherit;
    background:currentColor;
    border:none;
    border-radius:0;
    padding:16px;
    font-size:17px;
    font-weight:500;
    letter-spacing:2px;
    cursor:pointer;
    font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;
    -webkit-appearance:none;
    appearance:none;
  }
  button span{
    color:var(--bg, #123E8C);
    display:inline-block;
    transform:scaleX(0.6);
  }
  button:active{ opacity:0.85; }
  button:disabled{ opacity:0.5; }
  .status{
    margin-top:16px;
    text-align:center;
    font-size:14px;
    min-height:20px;
    letter-spacing:1px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h2 class="hero">The Poetry of Desire</h2>
    <div class="tag">現場投稿</div>
    <h1>把感覺留在這裡</h1>
    <p class="sub">你的文字將會出現在現場投影，<br>和其他人相遇。</p>

    <form id="f">
      <label for="poem">投稿區</label>
      <textarea id="poem" maxlength="120" placeholder="寫下此刻浮現的東西……" required></textarea>
      <div class="count"><span id="cnt">0</span>/120</div>

      <label for="author">署名（不填就是不具名）</label>
      <input type="text" id="author" maxlength="20" placeholder="不具名">

      <button type="submit" id="btn"><span>送出</span></button>
      <div class="status" id="status"></div>
    </form>
  </div>

<script>
  var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbywrbT-ehHvpV60g1RmNGb6DaXWZDCTkuY8ZL0jdZz_2Piz4eJUzQSHOmOLTDyTZ6K_/exec";

  // 跟 display.html 用同一組配色，每次打開隨機挑一組，手機投稿頁跟大螢幕是同一個世界觀
  var COLOR_PALETTE = [
    { bg:'#123E8C', fg:'#E8323A' },
    { bg:'#7A1010', fg:'#E8323A' },
    { bg:'#0A0A0A', fg:'#C13FD6' }
  ];
  var color = COLOR_PALETTE[Math.floor(Math.random() * COLOR_PALETTE.length)];
  document.documentElement.style.setProperty('--bg', color.bg);
  document.documentElement.style.setProperty('--fg', color.fg);

  var poemEl = document.getElementById('poem');
  var cntEl = document.getElementById('cnt');
  poemEl.addEventListener('input', function(){
    cntEl.textContent = poemEl.value.length;
  });

  document.getElementById('f').addEventListener('submit', function(e){
    e.preventDefault();
    var btn = document.getElementById('btn');
    var status = document.getElementById('status');
    var poem = poemEl.value.trim();
    var author = document.getElementById('author').value.trim();

    if (!poem) return;

    btn.disabled = true;
    btn.querySelector('span').textContent = '送出中…';
    status.textContent = '';

    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ poem: poem, author: author })
    })
    .then(function(r){ return r.json(); })
    .then(function(data){
      if (data.ok) {
        status.textContent = '收到了 ✦ 等一下留意牆上';
        document.getElementById('f').reset();
        cntEl.textContent = '0';
      } else {
        throw new Error(data.error || 'unknown');
      }
    })
    .catch(function(err){
      status.textContent = '送出失敗，再試一次';
    })
    .finally(function(){
      btn.disabled = false;
      btn.querySelector('span').textContent = '送出';
    });
  });
</script>
</body>
</html>
